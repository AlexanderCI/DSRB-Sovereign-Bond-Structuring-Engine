[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dsrb-sdrb-structuring-engine"
version = "0.1.0"
description = "Structured finance engine for a synthetic DSRB Sovereign Defence and Resilience Bond."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "PyYAML>=6.0",
    "matplotlib>=3.8"
]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
